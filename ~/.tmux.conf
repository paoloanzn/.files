# Reset prefix from Ctrl-b to `
unbind C-b
set -g prefix `

# Double prefix to switch between current and last used windows.
bind-key ` last-window

# Custom status bar appearence.
set -g status-position bottom
set -g status-bg colour234
set -g status-fg colour137
set -g status-left ''
set -g status-right '#[fg=colour233,bg=colour241,bold] %d/%m #[fg=colour233,bg=colour245,bold] %H:%M:%S '
set -g status-right-length 50
set -g status-left-length 20
setw -g window-status-current-format ' #I#[fg=colour248]:#[fg=colour255]#W#[fg=colour50]#F '
setw -g window-status-format ' #I#[fg=colour237]:#[fg=colour250]#W#[fg=colour244]#F '

# Enable vi-mode (vim keybindings).
setw -g mode-keys vi

# Scrolling
set -g mouse on

# Set how far you can scroll back in the terminal buffer.
set-option -g history-limit 100000

# Enable system's clipboard integration.
set-option -g set-clipboard on

# Copy text in vi-mode using pbcopy (Macos only).
if-shell 'test "$(uname -s)" = "Darwin"' {
    bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel 'pbcopy'
}

# Kill window prefix + k
bind-key k kill-window

# Send prefix to nested window.
# Handle host-child tmux scenarios when inside a tmux process from a another host tmux process.
# Use to insert ` as a character.
bind-key e send-prefix
bind-key n send-prefix

